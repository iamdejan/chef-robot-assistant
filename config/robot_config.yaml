chef_robot_assistant:
  camera_topic: "/usb_cam/image_raw"
  camera_frame_topic_out: "/chef_robot_assistant/image_annotated"
  detection_confidence_threshold: 0.5
  capture_duration_sec: 3.0
  wait_for_retry_prompt_sec: 2.5
  vision_workspace_name: "lee-zhi-yang"
  vision_workflow_id: "ingredient-detection-api"
  vision_sample_frame_count: 3
  vision_min_frame_hits: 2
  vision_frame_stale_timeout_sec: 2.0
  min_ingredient_count: 2
  idle_restart_delay_sec: 3.0
  speech_retry_limit: 3
  speech_input_device: "default"
  speech_record_seconds: 4.0
  speech_sample_rate_hz: 16000
  speech_channels: 1
  speech_silence_rms_threshold: 150.0
  speech_model_name: "small"
  speech_compute_type: "int8"
  speech_language: ""
  speech_beam_size: 1
  recipe_model_name: "gemini-3.1-flash-lite"
  recipe_api_timeout_sec: 20.0
  recipe_temperature: 0.4
  recipe_max_output_tokens: 512
  recipe_retry_buffer_sec: 5.0
  default_cuisine: "malay"
  image_generation_enabled: true
  tts_voice: "en"
  tts_speed_wpm: 165
  display_window_enabled: true
  display_recipe_window_name: "Chef Robot Recipe"
  display_image_window_name: "Chef Robot Dish Image"
  display_window_width: 1280
  display_window_height: 720
  image_model_name: "Tongyi-MAI/Z-Image-Turbo"
  image_api_timeout_sec: 60.0
  image_output_dir: "/tmp/chef_robot_assistant_generated_media"
  image_width: 1024
  image_height: 1024
